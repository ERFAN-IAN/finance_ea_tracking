services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    build: ./backend/
    container_name: django_financial_ea_tracker
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: financial_tracker
      DB_USER: root
      DB_PASSWORD: 123456

    depends_on:
      - db

  frontend:
    build: ./frontend/
    container_name: nextjs_financial_ea_tracker
    command: npm run dev
    # environment:
    #   WATCHPACK_POLLING: false
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules


  db:
    image: mysql:8.4
    container_name: mysql_financial_ea_tracker
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: financial_tracker
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "7000:3306"

volumes:
  mysql_data:
  node_modules:
