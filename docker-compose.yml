services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    build: ./backend/
    container_name: django_financial_ea_tracker
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      PRODUCTION: ${PRODUCTION}
      DOMAIN: ${DOMAIN}
      ACCESS_TOKEN_LIFETIME_MINUTES: ${ACCESS_TOKEN_LIFETIME_MINUTES}
      REFRESH_TOKEN_LIFETIME_DAYS: ${REFRESH_TOKEN_LIFETIME_DAYS}

    depends_on:
      - db

  frontend:
    build: ./frontend/
    container_name: nextjs_financial_ea_tracker
    command: npm run dev
    environment:
      BACKEND_API_SERVER: ${BACKEND_API_SERVER}
      NEXT_PUBLIC_BACKEND_API: ${NEXT_PUBLIC_BACKEND_API}
      ACCESS_TOKEN_LIFETIME_MINUTES: ${ACCESS_TOKEN_LIFETIME_MINUTES}
      REFRESH_TOKEN_LIFETIME_DAYS: ${REFRESH_TOKEN_LIFETIME_DAYS}

    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules

    depends_on:
      - backend

  db:
    image: mysql:8.4
    container_name: mysql_financial_ea_tracker
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "7000:3306"

volumes:
  mysql_data:
  node_modules:
